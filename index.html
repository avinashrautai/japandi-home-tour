<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home in Peace</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui}canvas{display:block}.start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#111}.start h1{font:64px Georgia}.start button{padding:14px 24px;border:0}.ui{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;top:18px;left:20px}.brand b{display:block;font:24px Georgia;letter-spacing:.15em}.brand span,.room,.hint{font-size:8px;letter-spacing:.25em;opacity:.65}.room{position:absolute;right:20px;top:22px}.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap}.actions{position:absolute;right:14px;bottom:12px;pointer-events:auto}.actions button{margin-left:6px;border:1px solid #fff4;background:#111c;color:#fff;border-radius:22px;padding:11px 15px}.card{position:absolute;left:50%;bottom:65px;transform:translateX(-50%);width:min(380px,calc(100% - 28px));padding:18px;background:#111e;border:1px solid #fff2;border-radius:15px;backdrop-filter:blur(16px);display:none;pointer-events:auto}.card.show{display:block}.card h2{font:28px Georgia;margin:6px 0}.card p{font-size:12px;line-height:1.5;opacity:.72}.card button{padding:10px 14px;border-radius:20px;border:1px solid #fff3;background:#fff1;color:#fff}</style></head><body><div class="ui"><div class="brand"><b>JAPANDI</b><span>HOME IN PEACE · BY AVINASH</span></div><div class="room" id="room">ARRIVAL</div><div class="hint">DRAG TO LOOK · W A S D TO WALK · AIM AT OBJECTS</div><div class="actions"><button id="light">LIGHT</button><button id="reset">RESET</button></div><div class="card" id="card"><div class="room" id="ck">OBJECT</div><h2 id="ct"></h2><p id="cp"></p><button id="sit">SIT</button><button id="close">CLOSE</button></div></div><div class="start" id="start"><div style="text-align:center"><div class="brand">ONE HOUSE · ONE CONTINUOUS WORLD</div><h1>Home in Peace</h1><div style="opacity:.6;letter-spacing:.2em;font-size:9px">JAPANDI HOME TOUR · BY AVINASH</div><button id="enter">ENTER HOUSE</button></div></div><script type="module">import * as THREE from 'https://unpkg.com/three@0.180.0/build/three.module.js';import{OrbitControls}from'https://unpkg.com/three@0.180.0/examples/jsm/controls/OrbitControls.js';const s=new THREE.Scene();s.background=new THREE.Color(0x96988d);s.fog=new THREE.Fog(0x96988d,20,60);const c=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.05,120);c.position.set(0,1.7,15);const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.6));r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.08;r.shadowMap.enabled=true;document.body.appendChild(r.domElement);s.add(new THREE.HemisphereLight(0xf0eee4,0x45423b,2));const sun=new THREE.DirectionalLight(0xffe2b5,4);sun.position.set(-10,18,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);s.add(sun);const M={p:new THREE.MeshStandardMaterial({color:0xcfc7b5,roughness:.82}),w:new THREE.MeshStandardMaterial({color:0x68472d,roughness:.58}),d:new THREE.MeshStandardMaterial({color:0x241b15,roughness:.5}),g:new THREE.MeshStandardMaterial({color:0x31432e,roughness:.95}),glass:new THREE.MeshPhysicalMaterial({color:0xb7cbc5,roughness:.1,transmission:.2,transparent:true,opacity:.52})};const box=(n,p,z,m)=>{let q=new THREE.Mesh(new THREE.BoxGeometry(...z),m);q.name=n;q.position.set(...p);q.castShadow=q.receiveShadow=true;s.add(q);return q};box('ground',[0,-.1,0],[42,.2,42],new THREE.MeshStandardMaterial({color:0x77766d,roughness:.96}));box('path',[0,.02,9],[3.8,.08,15],new THREE.MeshStandardMaterial({color:0xa8a198,roughness:.95}));box('house',[0,2,-3.2],[13,4,7.4],M.p);box('veranda',[0,1.2,1.0],[12.2,.25,2.2],M.w);box('roof',[0,4.35,-3.15],[14.2,.22,8.5],M.d);for(let x=-5.5;x<=5.5;x+=1.8)box('post',[x,2,-.05],[.16,3.55,.18],M.d);box('glass',[0,2,-.2],[11.5,3.2,.08],M.glass,false);box('door',[0,1.65,.84],[1.5,3,.12],M.d);box('table',[0,1,-2.4],[2.7,.12,1.15],M.w);const ch1=box('chair1',[2.1,.7,-2.3],[.8,1.2,.8],M.w),ch2=box('chair2',[-2.1,.7,-2.3],[.8,1.2,.8],M.w);box('tree1',[-7.8,1,5.5],[1.5,2,1.5],M.g);box('tree2',[8,1,5],[1.7,2.3,1.7],M.g);const bulb=new THREE.PointLight(0xffd19a,0,6);bulb.position.set(3.7,2.3,-2);s.add(bulb);const ctl=new OrbitControls(c,r.domElement);ctl.enablePan=false;ctl.enableZoom=false;ctl.enableDamping=true;ctl.target.set(0,1.5,-3);let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function walk(dt){let v=new THREE.Vector3((keys.d?1:0)-(keys.a?1:0),0,(keys.s?1:0)-(keys.w?1:0));if(!v.length())return;v.normalize().multiplyScalar(dt*3);let f=new THREE.Vector3();c.getWorldDirection(f);f.y=0;f.normalize();let rr=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0)).normalize();c.position.addScaledVector(f,-v.z);c.position.addScaledVector(rr,v.x);c.position.x=THREE.MathUtils.clamp(c.position.x,-9,9);c.position.z=THREE.MathUtils.clamp(c.position.z,-13,17);ctl.target.set(c.position.x,1.5,c.position.z-3)}document.getElementById('enter').onclick=()=>document.getElementById('start').remove();document.getElementById('light').onclick=()=>bulb.intensity=bulb.intensity?0:4;document.getElementById('reset').onclick=()=>{c.position.set(0,1.7,15);ctl.target.set(0,1.5,-3);document.getElementById('room').textContent='ARRIVAL'};document.getElementById('close').onclick=()=>document.getElementById('card').classList.remove('show');document.getElementById('sit').onclick=()=>{c.position.set(2.1,1.25,-3);ctl.target.set(0,1.25,-5);document.getElementById('room').textContent='SEATED VIEW';document.getElementById('card').classList.remove('show')};r.domElement.onclick=()=>{ray.setFromCamera(new THREE.Vector2(0,0),c);const h=ray.intersectObjects([ch1,ch2],true)[0];if(h){document.getElementById('ct').textContent='Lounge Chair';document.getElementById('cp').textContent='Sit here to experience the garden from a lower eye-line.';document.getElementById('sit').style.display='inline-block';document.getElementById('card').classList.add('show')}};const ray=new THREE.Raycaster();let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;walk(dt);ctl.update();r.render(s,c);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
